<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결과 상세 — Raphael Agent Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#129517;</text></svg>">
<style>
  :root {
    --bg: #f6efe6; --panel: #fffdf9; --text: #3d3428; --muted: #8a7c6c;
    --accent: #4f79d8; --accent-soft: #ebf0ff; --border: rgba(229,217,200,0.96);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .head {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px 22px; margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  }
  .head-meta { min-width: 0; }
  .kicker { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { font-size: 17px; margin-top: 3px; word-break: break-all; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    display: inline-block; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px; font-weight: 700;
    text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn:hover { filter: brightness(0.96); }
  .content {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 24px; min-height: 300px;
  }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.65; font-family: inherit; }
  iframe { width: 100%; height: 78vh; border: 0; border-radius: 10px; background: white; }
  .err { color: #ca6f51; font-weight: 700; }
  .loading { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-meta">
      <div class="kicker" id="kicker">결과 상세</div>
      <h1 id="fileName">불러오는 중…</h1>
      <div class="sub" id="fileMeta"></div>
    </div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="content" id="content"><div class="loading">내용을 불러오는 중…</div></div>
</div>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const dir = qs.get('dir') || 'results';
  const file = qs.get('file') || '';
  const nameEl = document.getElementById('fileName');
  const metaEl = document.getElementById('fileMeta');
  const kickerEl = document.getElementById('kicker');
  const actionsEl = document.getElementById('actions');
  const contentEl = document.getElementById('content');

  if (!file || file.includes('/') || file.includes('..')) {
    nameEl.textContent = '잘못된 요청';
    contentEl.innerHTML = '<div class="err">파일이 지정되지 않았습니다.</div>';
    return;
  }

  const dirLabel = { results: '도착한 결과', verifications: '검토 메모', digests: '운영 기록' }[dir] || dir;
  kickerEl.textContent = dirLabel;
  nameEl.textContent = file;
  document.title = file + ' — Raphael Agent Hub';

  const rawUrl = '/files/' + dir + '/' + encodeURIComponent(file);
  const ext = (file.split('.').pop() || '').toLowerCase();

  const dl = document.createElement('a');
  dl.className = 'btn primary';
  dl.href = rawUrl + '?download=1';
  dl.textContent = '다운로드';
  actionsEl.append(dl);

  const raw = document.createElement('a');
  raw.className = 'btn';
  raw.href = rawUrl;
  raw.target = '_blank';
  raw.textContent = ext === 'html' ? '원본 페이지로 보기' : '원본 텍스트로 보기';
  actionsEl.append(raw);

  if (ext === 'html') {
    const iframe = document.createElement('iframe');
    iframe.setAttribute('sandbox', 'allow-downloads');
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.title = file + ' 안전 미리보기';
    iframe.src = rawUrl;
    contentEl.innerHTML = '';
    contentEl.append(iframe);
    metaEl.textContent = 'HTML 결과물 — 아래에 렌더된 화면이 표시됩니다.';
    return;
  }

  fetch(rawUrl)
    .then((res) => {
      if (!res.ok) throw new Error('파일을 찾을 수 없습니다 (' + res.status + ')');
      return res.text();
    })
    .then((text) => {
      metaEl.textContent = (text.length / 1024).toFixed(1) + ' KB';
      const pre = document.createElement('pre');
      pre.textContent = ext === 'json' ? JSON.stringify(JSON.parse(text), null, 2) : text;
      contentEl.innerHTML = '';
      contentEl.append(pre);
    })
    .catch((err) => {
      contentEl.innerHTML = '<div class="err">' + err.message + '</div>';
    });
})();
</script>
</body>
</html>
